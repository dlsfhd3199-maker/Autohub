name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --package-import-method=copy --child-concurrency=2 --network-concurrency=16
      - run: pnpm security:scan
      - run: pnpm security:audit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --package-import-method=copy --child-concurrency=2 --network-concurrency=16
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:lint
      - run: pnpm test:e2e
      - if: always()
        run: pnpm db:stop --no-backup
